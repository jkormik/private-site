<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Basic SEO -->
    <title>{% block title %}My Professional Site{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Professional resume and blog of a software engineer.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}resume, blog, software engineer, portfolio{% endblock %}">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourdomain.com">
    <meta property="og:title" content="{% block og_title %}My Professional Site{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Professional resume and blog of a software engineer.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}https://yourdomain.com/static/img/og-default.jpg{% endblock %}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="{% block twitter_title %}My Professional Site{% endblock %}">
    <meta property="twitter:description" content="{% block twitter_description %}Professional resume and blog of a software engineer.{% endblock %}">
    <meta property="twitter:image" content="{% block twitter_image %}https://yourdomain.com/static/img/og-default.jpg{% endblock %}">
    
    <!-- Tailwind CSS CDN for development speed, but including the local compiled CSS as per PLAN.md -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    
    <style>
        /* Additional global styles if absolutely necessary, but sticking to Tailwind */
        :root {
            --accent-color: #2563eb; /* A professional blue */
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans leading-normal flex flex-col min-h-screen">

    <!-- Main Content Area -->
    <main class="flex-grow py-10">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            {% block content %}
            <!-- Content from child templates goes here -->
            {% endblock %}
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const alerts = document.querySelectorAll('.admin-alert');
            alerts.forEach(alert => {
                setTimeout(() => {
                    alert.style.transition = 'opacity 1s ease-out';
                    alert.style.opacity = '0';
                    setTimeout(() => {
                        alert.remove();
                    }, 1000);
                }, 4000);
            });
        });
    </script>

</body>
</html>
